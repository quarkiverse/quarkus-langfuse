quarkus.http.test-port=0

# Quarkus 4 samples 10% of traces by default; sample everything so the OTel test is deterministic
quarkus.otel.traces.sampler=always_on

quarkus.log.category."io.quarkiverse.langfuse".level=DEBUG

quarkus.langfuse.log-requests=true
quarkus.langfuse.log-responses=true
quarkus.langfuse.pretty-print=true

quarkus.langchain4j.log-requests=true
quarkus.langchain4j.log-responses=true
quarkus.langchain4j.openai.api-key=change-me

%dev,test.quarkus.langchain4j.openai.base-url=http://localhost:${quarkus.wiremock.devservices.port}/v1/

%dev,test.quarkus.wiremock.devservices.files-mapping=src/test/resources/wiremock

# TODO Remove once fixed upstream (see https://github.com/quarkiverse/quarkus-langchain4j/issues/3127 and
# https://github.com/quarkusio/quarkus/issues/58088).
# quarkus-langchain4j's OpenAiRestApi$ObjectMapperHolder resolves its ObjectMapper from Arc in a static initializer.
# On the Quarkus 4 line the REST client's reflection registration makes the nest member reachable, so it is initialized
# at build time, where Arc.container() is still null and the native image build fails.
# NOTE: this is a single comma-separated value - anything else needing a native build arg here must join this line.
quarkus.native.additional-build-args=--initialize-at-run-time=io.quarkiverse.langchain4j.openai.common.OpenAiRestApi$ObjectMapperHolder
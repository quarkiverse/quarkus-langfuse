name: Build and Test

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
      - '*.md'
      - '*.adoc'
      - '*.txt'
      - '.all-contributorsrc'
      - '.github/project.yml'
  pull_request:
    paths-ignore:
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
      - '*.md'
      - '*.adoc'
      - '*.txt'
      - '.all-contributorsrc'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  issues: write
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  native-build:
    name: Build native on ${{ matrix.os }} - ${{ matrix.java }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        java: [ 25 ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Reclaim disk space
        working-directory: .github
        shell: bash
        run: scripts/ci-reclaim-disk-space.sh

      - uses: graalvm/setup-graalvm@v1.6.8
        with:
          java-version: ${{ matrix.java }}
          distribution: mandrel # See 'Supported distributions' for available options
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
          native-image-job-reports: true
          native-image-pr-reports: true
          native-image-pr-reports-update-existing: true

      - name: Build with Maven
        run: ./mvnw -B formatter:validate clean install -Pnative

  build:
    name: Build on ${{ matrix.os }} - ${{ matrix.java }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        java: [17, 21, 25]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Reclaim disk space
        working-directory: .github
        shell: bash
        run: scripts/ci-reclaim-disk-space.sh

      # JDK 21 is installed first so the matrix JDK stays the default. The extra JDK 21 is registered as a Maven
      # toolchain, which is how the Quarkus 4 exporter module compiles on JDK 17 (Quarkus 4 classes need Java 21).
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: |
            21
            ${{ matrix.java }}
          cache: maven

      - name: Build with Maven
        run: ./mvnw -B formatter:validate clean install

  build-quarkus4:
    name: Build against the Quarkus 4 line
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Reclaim disk space
        working-directory: .github
        shell: bash
        run: scripts/ci-reclaim-disk-space.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Mirrors what the nightly ecosystem CI does against Quarkus main, but pinned to a released Quarkus 4 so the
      # signal lands on the PR that breaks it. Docs are excluded (quarkus-antora is not on the Quarkus 4 line).
      - name: Build with Maven
        run: >-
          ./mvnw -B clean install -Pquarkus4 --fail-at-end
          --projects '!io.quarkiverse.langfuse:quarkus-langfuse-docs'

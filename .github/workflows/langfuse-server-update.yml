name: Langfuse server update check

# Weekly check for newer Langfuse server releases. Moves the vendored OpenAPI spec and the default
# Dev Services / Testcontainers images to the newest release the full build (including the integration
# tests) passes against, and opens a pull request for it. Releases the build fails against get an issue,
# and the next older release is tried. See .github/scripts/langfuse-server-bump.sh.

on:
  schedule:
    # Mondays, 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      max-attempts:
        description: 'Maximum number of Langfuse releases to build, newest first'
        required: false
        default: '5'
      dry-run:
        description: 'Build and report, but do not push, open pull requests or create issues'
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check for a newer Langfuse server
    if: github.repository == 'quarkiverse/quarkus-langfuse'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7

      - name: Reclaim disk space
        working-directory: .github
        run: scripts/ci-reclaim-disk-space.sh

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build against newer Langfuse releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          MAX_ATTEMPTS: ${{ inputs.max-attempts || '5' }}
          DRY_RUN: ${{ inputs.dry-run || 'false' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/langfuse-server-bump.sh

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: langfuse-server-bump-logs
          path: target/langfuse-server-bump/
          if-no-files-found: ignore
          retention-days: 14
